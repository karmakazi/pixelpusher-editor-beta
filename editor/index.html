<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pixelpusher Editor</title>
  <link rel="stylesheet" href="/editor/editor.css">
  <script defer src="/editor/case-copy.js"></script>
  <script defer src="/editor/editor.js"></script>
</head>
<body>
  <header><strong>PIXELPUSHER</strong><span>Site editor</span><a href="/">View site ↗</a><button class="secondary" id="sign-out" hidden>Sign out</button></header>
  <section class="sign-in" id="sign-in" aria-labelledby="sign-in-heading" hidden>
    <h1 id="sign-in-heading">Sign in to the editor</h1>
    <form id="login">
      <label for="access">Editor password</label>
      <input id="access" type="password" autocomplete="current-password" required>
      <button id="login-button">Sign in</button>
    </form>
  </section>
  <p id="session-status" role="status">Checking sign-in…</p>
  <main id="workspace" hidden>
    <section class="controls" aria-labelledby="heading">
      <h1 id="heading">Edit a case study</h1>
      <label for="project">Project</label>
      <select id="project" disabled></select>
      <label for="field">Copy to edit</label>
      <select id="field" disabled></select>
      <form id="assistant">
        <label for="instruction">What should change?</label>
        <textarea id="instruction" rows="3" maxlength="1500" required placeholder="Revise the draft, for example: Make it shorter."></textarea>

        <button id="generate" disabled>Draft with AI</button>
      </form>
      <p id="status" role="status"></p>
      <div class="original"><h2>Published copy</h2><p id="original"></p></div>
      <label for="draft">Draft copy <small id="count"></small></label>
      <textarea id="draft" rows="4" disabled></textarea>
      <button class="secondary" id="restore-draft" type="button" hidden>Restore previous draft</button>
      <p id="changes" role="status"></p>
      <div class="actions">
        <button id="publish" disabled>Publish to beta</button>
        <button class="secondary" id="undo" disabled>Undo publish</button>
        <button class="secondary" id="reset" disabled>Reset all edits</button>
      </div>
      <p id="release-status" role="status"></p>
      <a id="commit" hidden target="_blank" rel="noopener">View GitHub commit ↗</a>
      <a id="live" hidden target="_blank" rel="noopener">View live case study ↗</a>
    </section>
    <section class="preview" aria-label="Case study preview">
      <div class="preview-bar"><strong>Draft preview</strong><button class="secondary" id="mobile" aria-pressed="false">Mobile view</button></div>
      <iframe id="preview" title="Pixelpusher case study preview"></iframe>
    </section>
  </main>
</body>
</html>
